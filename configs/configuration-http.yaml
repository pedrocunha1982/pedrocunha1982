# Adicionar ao /config/configuration.yaml do Home Assistant
# Este bloco permite que o Tailscale Funnel funcione como reverse proxy
#
# Servidor: GMKtec G9 (192.168.0.84)
# Home Assistant OS 13.2

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
  ip_ban_enabled: true
  login_attempts_threshold: 5
